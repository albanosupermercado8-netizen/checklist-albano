<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>Checklist Rotina Gerencial — Albano Supermercado</title>
<meta name="theme-color" content="#061764">
<link rel="manifest" href="manifest.json">
<link rel="icon" href="logo.png">
<link rel="apple-touch-icon" href="icon-192.png">
<style>
  :root{
    --navy:#061764;
    --navy-2:#0A1F7A;
    --blue:#0A29B5;
    --blue-light:#E8EAF8;
    --green:#1F9D57;
    --green-light:#E5F6EC;
    --gold:#C98A1E;
    --gold-light:#FBF0DD;
    --gray:#6B7280;
    --gray-dim:#9AA3B2;
    --gray-light:#F4F5F8;
    --border:#E7E9F0;
    --white:#FFFFFF;
    --danger:#C4433F;
    --danger-light:#FBEAEA;
    --ink:#1B2233;
    --radius-lg:16px;
    --radius-md:12px;
    --radius-sm:8px;
    --shadow-sm:0 1px 2px rgba(16,24,64,.06), 0 1px 1px rgba(16,24,64,.04);
    --shadow-md:0 4px 14px rgba(16,24,64,.08), 0 1px 3px rgba(16,24,64,.06);
    --shadow-lg:0 10px 30px rgba(6,23,100,.16);
  }
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent;}
  html{-webkit-font-smoothing:antialiased;text-rendering:optimizeLegibility;}
  body{
    margin:0;
    font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
    background:var(--gray-light);
    color:var(--ink);
  }
  svg.ic{ display:block; flex-shrink:0; }

  /* ---------- Header ---------- */
  header{
    position:relative;
    background:
      radial-gradient(120% 140% at 100% -10%, rgba(255,255,255,.14), transparent 55%),
      linear-gradient(160deg,var(--navy) 0%,var(--navy-2) 45%,var(--blue) 100%);
    color:#fff;
    padding:16px 16px 14px;
    position:sticky;
    top:0;
    z-index:20;
    box-shadow:0 4px 18px rgba(6,23,100,.28);
  }
  header h1{
    margin:0;
    font-size:15.5px;
    font-weight:800;
    letter-spacing:.2px;
  }
  header .sub{
    font-size:11px;
    opacity:.78;
    margin-top:1px;
    letter-spacing:.3px;
    text-transform:uppercase;
    font-weight:600;
  }
  .header-row{
    display:flex;
    justify-content:space-between;
    align-items:center;
    gap:10px;
  }
  .brand{
    display:flex;
    align-items:center;
    gap:11px;
  }
  .brand img{
    width:42px;
    height:42px;
    border-radius:11px;
    box-shadow:0 3px 10px rgba(0,0,0,.3);
    border:1px solid rgba(255,255,255,.25);
  }

  .user-chip{
    display:flex;
    align-items:center;
    gap:8px;
    background:rgba(255,255,255,.10);
    border:1px solid rgba(255,255,255,.16);
    border-radius:20px;
    padding:5px 6px 5px 12px;
    flex-shrink:0;
  }
  .user-chip .uc-label{
    font-size:11px;
    font-weight:700;
    color:#fff;
    white-space:nowrap;
  }
  .user-chip .uc-role{
    display:block;
    font-size:8.5px;
    font-weight:600;
    color:rgba(255,255,255,.6);
    text-transform:uppercase;
    letter-spacing:.3px;
  }
  .user-chip button{
    display:flex;
    align-items:center;
    justify-content:center;
    width:26px;
    height:26px;
    border-radius:50%;
    border:none;
    background:rgba(255,255,255,.14);
    color:#fff;
  }
  .user-chip button:active{ background:rgba(255,255,255,.26); }

  /* ---------- Login screen ---------- */
  .login-screen{
    position:fixed;
    inset:0;
    z-index:100;
    display:flex;
    align-items:center;
    justify-content:center;
    padding:20px;
    background:
      radial-gradient(120% 140% at 100% -10%, rgba(255,255,255,.14), transparent 55%),
      linear-gradient(160deg,var(--navy) 0%,var(--navy-2) 45%,var(--blue) 100%);
  }
  .login-card{
    width:100%;
    max-width:360px;
    background:#fff;
    border-radius:20px;
    padding:30px 26px 26px;
    box-shadow:var(--shadow-lg);
    text-align:center;
  }
  .login-card img{
    width:64px; height:64px;
    border-radius:15px;
    box-shadow:0 4px 14px rgba(0,0,0,.18);
    margin-bottom:14px;
  }
  .login-card h2{
    margin:0 0 2px;
    font-size:16.5px;
    font-weight:800;
    color:var(--ink);
  }
  .login-sub{
    font-size:11.5px;
    color:var(--gray);
    font-weight:600;
    text-transform:uppercase;
    letter-spacing:.3px;
    margin:0 0 24px;
  }
  .login-field{
    text-align:left;
    margin-bottom:14px;
  }
  .login-field label{
    display:block;
    font-size:10.5px;
    font-weight:700;
    color:var(--gray);
    text-transform:uppercase;
    letter-spacing:.3px;
    margin-bottom:5px;
  }
  .login-field select, .login-field input{
    width:100%;
    padding:11px 13px;
    border-radius:10px;
    border:1.5px solid var(--border);
    font-size:13.5px;
    font-family:inherit;
    font-weight:600;
    color:var(--ink);
    background:#fff;
  }
  .login-field select:focus, .login-field input:focus{
    outline:none;
    border-color:var(--blue);
  }
  .login-btn{
    width:100%;
    padding:13px;
    border-radius:11px;
    border:none;
    background:linear-gradient(135deg,var(--blue),var(--navy));
    color:#fff;
    font-size:14px;
    font-weight:800;
    font-family:inherit;
    margin-top:6px;
    box-shadow:0 6px 16px rgba(10,41,181,.3);
  }
  .login-btn:active{ transform:scale(.98); }
  .login-error{
    color:var(--danger);
    font-size:11.5px;
    font-weight:700;
    margin-top:12px;
    min-height:14px;
  }

  .id-row{
    display:flex;
    gap:8px;
    margin-top:14px;
  }
  .id-field{
    flex:1;
    display:flex;
    align-items:center;
    gap:8px;
    background:rgba(255,255,255,.10);
    border:1px solid rgba(255,255,255,.16);
    border-radius:var(--radius-sm);
    padding:7px 10px;
    min-width:0;
    backdrop-filter:blur(6px);
  }
  .id-field .ic{ color:rgba(255,255,255,.65); }
  .id-field .id-text{ min-width:0; flex:1; }
  .id-field label{
    display:block;
    font-size:9px;
    text-transform:uppercase;
    letter-spacing:.5px;
    opacity:.65;
    margin-bottom:1px;
    font-weight:600;
  }
  .id-field select, .id-field input{
    width:100%;
    background:transparent;
    border:none;
    color:#fff;
    font-size:12.5px;
    font-weight:600;
    font-family:inherit;
    padding:0;
  }
  .id-field select{ -webkit-appearance:none; appearance:none; }
  .id-field select option{ color:#111; }
  .id-field input::placeholder{ color:rgba(255,255,255,.45); font-weight:500; }
  .id-field:focus-within{ background:rgba(255,255,255,.16); border-color:rgba(255,255,255,.32); }

  .sector-tabs-row{
    display:flex;
    gap:8px;
    margin-top:14px;
    flex-wrap:wrap;
  }
  .sector-tab-btn{
    display:flex;
    align-items:center;
    gap:8px;
    padding:9px 16px;
    border-radius:20px;
    border:2px solid transparent;
    background:rgba(255,255,255,.16);
    color:#fff;
    font-size:12.5px;
    font-weight:800;
    font-family:inherit;
    transition:all .15s ease;
    box-shadow:0 1px 4px rgba(0,0,0,.12);
  }
  .sector-tab-btn .ic{ opacity:1; }
  .sector-tab-btn:not(.active):not(.disabled):hover{ background:rgba(255,255,255,.26); transform:translateY(-1px); }

  /* Distinct accent per sector */
  .sector-tab-btn[data-sector="operacional"]{ border-color:rgba(143,180,255,.55); }
  .sector-tab-btn[data-sector="operacional"].active{
    background:linear-gradient(135deg,#5B8DFF,#0A29B5);
    border-color:#5B8DFF;
    box-shadow:0 4px 14px rgba(10,41,181,.45);
  }
  .sector-tab-btn[data-sector="rh_dp"]{ border-color:rgba(240,200,120,.55); }
  .sector-tab-btn[data-sector="rh_dp"].active{
    background:linear-gradient(135deg,#FFD37A,var(--gold));
    color:#3A2600;
    border-color:#FFD37A;
    box-shadow:0 4px 14px rgba(201,138,30,.45);
  }
  .sector-tab-btn[data-sector="comercial"]{ border-color:rgba(124,224,176,.4); }
  .sector-tab-btn[data-sector="comercial"].active{
    background:linear-gradient(135deg,#5FE0A6,var(--green));
    border-color:#5FE0A6;
    box-shadow:0 4px 14px rgba(31,157,87,.45);
  }

  .sector-tab-btn.disabled{
    opacity:.55;
    cursor:not-allowed;
    background:rgba(255,255,255,.08);
  }
  .sector-tab-btn .badge-soon{
    font-size:8.5px;
    font-weight:800;
    text-transform:uppercase;
    background:rgba(255,255,255,.22);
    padding:2px 7px;
    border-radius:10px;
    letter-spacing:.3px;
  }
  .sector-tab-btn.active .badge-soon{ background:rgba(0,0,0,.18); color:#fff; }

  .subnav-row{
    display:flex;
    align-items:center;
    gap:8px;
    margin-top:10px;
  }
  .date-picker{
    display:flex;
    align-items:center;
    gap:6px;
    background:rgba(255,255,255,.10);
    border:1px solid rgba(255,255,255,.16);
    border-radius:var(--radius-sm);
    padding:6px 9px;
  }
  .date-picker .ic{ color:rgba(255,255,255,.65); }
  .date-picker input{
    background:transparent;
    border:none;
    color:#fff;
    font-size:12.5px;
    font-weight:600;
    font-family:inherit;
  }
  .date-picker input::-webkit-calendar-picker-indicator{filter:invert(1);opacity:.7;}

  .pill-tabs{
    display:flex;
    gap:6px;
    flex:1;
    background:rgba(0,0,0,.14);
    padding:3px;
    border-radius:10px;
  }
  .pill-tabs button{
    flex:1;
    padding:7px 4px;
    border-radius:7px;
    border:none;
    background:transparent;
    color:rgba(255,255,255,.75);
    font-size:11.5px;
    font-weight:700;
    font-family:inherit;
    transition:all .18s ease;
  }
  .pill-tabs button.active{
    background:#fff;
    color:var(--navy);
    box-shadow:0 2px 6px rgba(0,0,0,.18);
  }

  .progress-wrap{
    margin-top:12px;
    display:flex;
    align-items:center;
    gap:10px;
    background:rgba(255,255,255,.08);
    border:1px solid rgba(255,255,255,.14);
    border-radius:var(--radius-sm);
    padding:8px 10px;
  }
  .progress-bar-bg{
    flex:1;
    background:rgba(255,255,255,.22);
    border-radius:10px;
    height:7px;
    overflow:hidden;
  }
  .progress-bar-fill{
    background:linear-gradient(90deg,#fff,#CFE0FF);
    height:100%;
    border-radius:10px;
    transition:width .35s cubic-bezier(.4,0,.2,1);
  }
  .progress-label{
    font-size:11px;
    font-weight:700;
    font-variant-numeric:tabular-nums;
    opacity:.95;
    white-space:nowrap;
  }
  .btn-reset-icon{
    display:flex;
    align-items:center;
    justify-content:center;
    background:rgba(255,255,255,.12);
    border:1px solid rgba(255,255,255,.18);
    color:#fff;
    border-radius:8px;
    width:30px;
    height:30px;
    flex-shrink:0;
    transition:background .15s ease;
  }
  .btn-reset-icon:active{ background:rgba(255,255,255,.24); }

  /* ---------- Layout ---------- */
  main{
    padding:16px 14px;
    max-width:640px;
    margin:0 auto;
    padding-bottom:150px;
  }

  /* ---------- Checklist sections ---------- */
  .section-card{
    background:#fff;
    border-radius:var(--radius-lg);
    margin-bottom:14px;
    box-shadow:var(--shadow-md);
    overflow:hidden;
    border:1px solid var(--border);
  }
  .section-head{
    display:flex;
    justify-content:space-between;
    align-items:center;
    gap:10px;
    padding:14px 15px;
    background:linear-gradient(135deg,var(--navy),var(--navy-2));
    color:#fff;
    cursor:pointer;
    user-select:none;
    transition:filter .15s ease;
  }
  .section-head:active{ filter:brightness(1.08); }
  .section-head .head-left{
    display:flex;
    align-items:center;
    gap:11px;
    min-width:0;
  }
  .section-icon{
    width:34px;
    height:34px;
    min-width:34px;
    border-radius:10px;
    background:rgba(255,255,255,.14);
    border:1px solid rgba(255,255,255,.18);
    display:flex;
    align-items:center;
    justify-content:center;
    color:#fff;
  }
  .section-head .title-block{
    display:flex;
    flex-direction:column;
    min-width:0;
  }
  .section-head .title{
    font-size:14px;
    font-weight:800;
    letter-spacing:.1px;
  }
  .section-head .time{
    font-size:10.5px;
    opacity:.72;
    margin-top:1px;
    font-weight:600;
  }
  .section-head .head-right{
    display:flex;
    align-items:center;
    gap:8px;
    flex-shrink:0;
  }
  .section-head .count{
    font-size:11.5px;
    font-weight:800;
    font-variant-numeric:tabular-nums;
    background:rgba(255,255,255,.16);
    padding:4px 10px;
    border-radius:20px;
    white-space:nowrap;
  }
  .section-head .chevron{
    transition:transform .2s ease;
    color:rgba(255,255,255,.75);
    display:flex;
  }
  .section-head.collapsed .chevron{transform:rotate(-90deg);}

  .section-body{
    padding:8px 15px 14px;
  }
  .section-body.hidden{display:none;}

  .subheader{
    font-size:12px;
    font-weight:800;
    color:var(--blue);
    text-transform:uppercase;
    letter-spacing:.3px;
    margin:14px 0 6px;
    padding-bottom:6px;
    border-bottom:1.5px solid var(--blue-light);
  }
  .note{
    font-size:11.5px;
    font-style:italic;
    color:var(--gray);
    margin:2px 0 8px;
    line-height:1.4;
  }

  .check-item{
    display:flex;
    align-items:flex-start;
    gap:11px;
    padding:9px 3px;
    border-bottom:1px solid #F1F2F6;
    cursor:pointer;
    user-select:none;
  }
  .check-item:last-child{border-bottom:none;}
  .check-item input{ display:none; }
  .box{
    width:22px;
    height:22px;
    min-width:22px;
    border-radius:7px;
    border:2px solid #D3D9E6;
    display:flex;
    align-items:center;
    justify-content:center;
    margin-top:1px;
    transition:all .15s ease;
    background:#fff;
  }
  .check-item:active .box{ transform:scale(.92); }
  .check-item input:checked + .box{
    background:linear-gradient(135deg,var(--green),#178048);
    border-color:var(--green);
    box-shadow:0 2px 6px rgba(31,157,87,.35);
  }
  .box svg{
    width:13px;
    height:13px;
    opacity:0;
    transform:scale(.5);
    transition:all .15s ease;
  }
  .check-item input:checked + .box svg{
    opacity:1;
    transform:scale(1);
  }
  .check-item span.txt{
    font-size:13.5px;
    line-height:1.45;
    padding-top:2px;
    font-weight:500;
  }
  .check-item input:checked ~ span.txt{
    color:var(--gray-dim);
    text-decoration:line-through;
  }

  /* ---------- Sobre ---------- */
  .info-box{
    background:#fff;
    border-radius:var(--radius-lg);
    padding:4px;
    box-shadow:var(--shadow-md);
    border:1px solid var(--border);
    overflow:hidden;
  }
  .info-box-inner{
    background:linear-gradient(180deg,var(--blue-light),#fff 60%);
    border-radius:14px;
    padding:20px 18px;
  }
  .info-box .quote-mark{
    font-size:40px;
    line-height:1;
    color:var(--blue);
    opacity:.25;
    font-family:Georgia,serif;
    font-weight:800;
    margin-bottom:-6px;
  }
  .info-box p{
    margin:0 0 12px;
    font-size:13px;
    color:#2A3348;
    line-height:1.7;
  }
  .info-box p:last-of-type{margin-bottom:0;}
  .info-box .cta-block{
    text-align:center;
    margin-top:16px;
    padding-top:16px;
    border-top:1px dashed #C7D8EE;
  }
  .info-box .cta{
    font-weight:800;
    color:var(--navy);
    font-size:13.5px;
  }
  .info-box .cta-sub{
    font-size:11.5px;
    color:var(--gray);
    margin-top:5px;
    font-weight:600;
  }

  .empty-hint{
    text-align:center;
    color:var(--gray);
    font-size:12.5px;
    padding:46px 20px;
    line-height:1.6;
  }
  .empty-hint .ic{
    color:var(--gray-dim);
    margin:0 auto 14px;
  }

  /* ---------- Fixed action + nav bars ---------- */
  .fab-save{
    position:fixed;
    left:14px;
    right:14px;
    bottom:70px;
    max-width:612px;
    margin:0 auto;
    display:flex;
    align-items:center;
    justify-content:center;
    gap:8px;
    background:linear-gradient(135deg,#22AC63,var(--green));
    color:#fff;
    border:none;
    border-radius:13px;
    padding:14px;
    font-size:14px;
    font-weight:800;
    font-family:inherit;
    letter-spacing:.2px;
    box-shadow:0 8px 20px rgba(31,157,87,.38);
    z-index:20;
    transition:transform .1s ease;
  }
  .fab-save:active{ transform:scale(.98); }

  .bottom-nav{
    position:fixed;
    bottom:0;
    left:0;
    right:0;
    background:rgba(255,255,255,.96);
    backdrop-filter:blur(10px);
    border-top:1px solid var(--border);
    display:flex;
    z-index:20;
    padding:6px 8px env(safe-area-inset-bottom);
    box-shadow:0 -6px 18px rgba(16,24,64,.06);
  }
  .nav-btn{
    flex:1;
    border:none;
    background:none;
    font-family:inherit;
    padding:6px 2px;
    display:flex;
    flex-direction:column;
    align-items:center;
    gap:3px;
    color:var(--gray-dim);
    font-size:10px;
    font-weight:700;
  }
  .nav-btn .nav-ic-wrap{
    width:34px;
    height:26px;
    border-radius:9px;
    display:flex;
    align-items:center;
    justify-content:center;
    transition:background .18s ease;
  }
  .nav-btn.active{ color:var(--blue); }
  .nav-btn.active .nav-ic-wrap{ background:var(--blue-light); }

  .toast{
    position:fixed;
    bottom:126px;
    left:50%;
    transform:translateX(-50%) translateY(10px);
    background:var(--ink);
    color:#fff;
    padding:11px 20px;
    border-radius:30px;
    font-size:12.5px;
    font-weight:600;
    opacity:0;
    pointer-events:none;
    transition:all .25s ease;
    z-index:30;
    white-space:nowrap;
    max-width:90vw;
    text-overflow:ellipsis;
    overflow:hidden;
    box-shadow:0 8px 20px rgba(0,0,0,.25);
  }
  .toast.show{
    opacity:1;
    transform:translateX(-50%) translateY(0);
  }

  /* ---------- History ---------- */
  .filter-row{
    display:flex;
    gap:8px;
    margin-bottom:16px;
  }
  .filter-row select{
    flex:1;
    padding:10px 10px;
    border-radius:var(--radius-sm);
    border:1px solid var(--border);
    background:#fff;
    font-size:12.5px;
    font-weight:600;
    font-family:inherit;
    color:var(--ink);
    box-shadow:var(--shadow-sm);
  }
  .hist-card{
    background:#fff;
    border:1px solid var(--border);
    border-radius:var(--radius-md);
    padding:13px 14px;
    margin-bottom:10px;
    box-shadow:var(--shadow-sm);
    display:flex;
    gap:12px;
  }
  .hist-icon{
    width:38px;
    height:38px;
    min-width:38px;
    border-radius:10px;
    background:var(--blue-light);
    color:var(--blue);
    display:flex;
    align-items:center;
    justify-content:center;
  }
  .hist-body{ flex:1; min-width:0; }
  .hist-top{
    display:flex;
    justify-content:space-between;
    align-items:flex-start;
    gap:8px;
  }
  .hist-tipo{
    font-size:9.5px;
    font-weight:800;
    text-transform:uppercase;
    letter-spacing:.4px;
    color:var(--blue);
    background:var(--blue-light);
    padding:2px 8px;
    border-radius:20px;
    display:inline-block;
  }
  .hist-loja{
    font-size:14px;
    font-weight:800;
    margin-top:5px;
    color:var(--ink);
  }
  .hist-meta{
    font-size:11px;
    color:var(--gray);
    margin-top:2px;
    font-weight:500;
  }
  .hist-pct{
    font-size:18px;
    font-weight:800;

  #printArea{ display:none; }

  .hist-pdf-btn{
    display:flex;
    align-items:center;
    gap:5px;
    margin-top:8px;

    margin-top:2px;

  .cfg-save-btn{
    display:flex;
    align-items:center;
    justify-content:center;

    padding:8px 10px;

  /* ---------- Sidebar brand (desktop only) ---------- */
  .sidebar-brand{ display:none; }
  .sidebar-foot{ display:none; }
  .sidebar-user{ display:none; }

<div class="login-screen" id="loginScreen">

<div id="appShell" style="display:none;">
<header>

    <div class="brand">
      <img src="logo.png" alt="Albano Supermercado">

        <h1>Checklist Rotina Gerencial</h1>
        <div class="sub">Albano Supermercado</div>
      </div>
    </div>

</div>

<div id="printArea"></div>

}

function itemId(sectionId, groupIdx, idx){
  return sectionId + "__g" + groupIdx + "__" + idx;
}

function summarize(tab, checks){
  const sections = DATA[currentSector][tab];
  let total = 0, done = 0;
  const sectionSummaries = [];
  const pendentes = [];
  sections.forEach(s => {
    let sTotal = 0, sDone = 0;
    s.groups.forEach((g, gi) => g.items.forEach((text, idx) => {
      const id = itemId(s.id, gi, idx);
      sTotal++; total++;
      if (checks[id]) { sDone++; done++; }
      else pendentes.push(text);
    }));
    sectionSummaries.push({ id: s.id, title: s.title, done: sDone, total: sTotal });
  });
  const pct = total ? Math.round(done/total*100) : 0;
  return { total, done, pct, sections: sectionSummaries, pendentes };
}

function renderSection(section, checks){
  const isCollapsed = !!collapsedState[section.id];
  let itemsHtml = "";
  section.groups.forEach((g, gi) => {
    if (g.sub) itemsHtml += `<div class="subheader">${g.sub}</div>`;
    if (g.note) itemsHtml += `<div class="note">${g.note}</div>`;
    g.items.forEach((text, idx) => {
      const id = itemId(section.id, gi, idx);
      const checked = !!checks[id];
      itemsHtml += `
        <label class="check-item" data-item="${id}">
          <input type="checkbox" ${checked ? "checked" : ""} data-item="${id}">
          <span class="box">${icon("check", 13, 3)}</span>
          <span class="txt">${text}</span>
        </label>`;
    });
  });

  const total = section.groups.reduce((a,g)=>a+g.items.length,0);
  const done = section.groups.reduce((a,g,gi)=>a+g.items.filter((t,idx)=>!!checks[itemId(section.id,gi,idx)]).length,0);

  return `
    <div class="section-card">
      <div class="section-head ${isCollapsed ? 'collapsed' : ''}" data-section="${section.id}">
        <div class="head-left">
          <span class="section-icon">${icon(section.icon || "checklist", 18, 2)}</span>
          <div class="title-block">
            <span class="title">${section.title}</span>
            ${section.time ? `<span class="time">${section.time}</span>` : ""}
          </div>
        </div>
        <div class="head-right">
          <span class="count">${done}/${total}</span>
          <span class="chevron">${chevronIcon()}</span>
        </div>
      </div>
      <div class="section-body ${isCollapsed ? 'hidden' : ''}" id="body_${section.id}">
        ${itemsHtml}
      </div>
    </div>`;
}

let gradCounter = 0;
function barChartSvg(items, baseColor){
  const w = 300, h = 148, barGap = 10, topPad = 22, axisY = h - 22;
  const n = items.length || 1;
  const barW = Math.max(16, (w - barGap*(n+1)) / n);
  const gid = "grad" + (gradCounter++);
  let bars = "", labels = "";
  items.forEach((it, i) => {
    const x = barGap + i*(barW+barGap);
    const barH = Math.max(3, (it.value/100) * (axisY-topPad));
    const y = axisY - barH;
    bars += `<rect x="${x}" y="${y}" width="${barW}" height="${barH}" rx="4" fill="url(#${gid})"></rect>`;
    bars += `<text x="${x+barW/2}" y="${y-6}" font-size="9.5" font-weight="700" text-anchor="middle" fill="#374151">${it.value}%</text>`;
    labels += `<text x="${x+barW/2}" y="${h-6}" font-size="9" text-anchor="middle" fill="#8B93A5">${it.label}</text>`;
  });
  return `<svg viewBox="0 0 ${w} ${h}" style="width:100%;height:auto;display:block;">
    <defs><linearGradient id="${gid}" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="${baseColor.light}"/>
      <stop offset="100%" stop-color="${baseColor.dark}"/>
    </linearGradient></defs>
    <line x1="0" y1="${axisY}" x2="${w}" y2="${axisY}" stroke="#EDEFF4" stroke-width="1"/>
    ${bars}${labels}
  </svg>`;
}

function renderDashboard(){
  const scoped = isGerente();
  const trendTipo = SECTOR_META[currentSector].tipos[0];
  const hist = getHistorico().filter(r => (r.setor || "operacional") === currentSector && (!scoped || r.loja === session.loja));
  const diarios = hist.filter(r => r.tipo === trendTipo).sort((a,b) => new Date(a.savedAt) - new Date(b.savedAt));

  if (!hist.length){
    document.getElementById("main").innerHTML = emptyState("chartEmpty", "Ainda não há dados suficientes", "<span>Salve alguns checklists para ver o dashboard.</span>");
    return;
  }

  const totalExec = hist.length;
  const mediaGeral = Math.round(hist.reduce((a,r)=>a+r.pct,0) / hist.length);

  const porLoja = {};
  LOJAS.forEach(l => porLoja[l] = []);
  hist.forEach(r => { if (porLoja[r.loja]) porLoja[r.loja].push(r.pct); });
  let melhorLoja = "—", melhorMedia = -1;
  LOJAS.forEach(l => {
    if (porLoja[l].length){
      const m = Math.round(porLoja[l].reduce((a,b)=>a+b,0)/porLoja[l].length);
      if (m > melhorMedia){ melhorMedia = m; melhorLoja = l; }
    }
  });

  const seteDiasAtras = Date.now() - 7*24*60*60*1000;
  const execSemana = hist.filter(r => new Date(r.savedAt).getTime() >= seteDiasAtras).length;

  let html = `<div class="stat-grid">
    <div class="stat-card">
      <div class="stat-icon" style="background:var(--blue-light);color:var(--blue);">${icon("box",17,2)}</div>
      <div class="val">${totalExec}</div><div class="lbl">Checklists salvos</div>
    </div>
    <div class="stat-card">
      <div class="stat-icon" style="background:var(--green-light);color:var(--green);">${icon("trendUp",17,2)}</div>
      <div class="val">${mediaGeral}%</div><div class="lbl">Média geral de conclusão</div>
    </div>
    ${scoped ? "" : `<div class="stat-card">
      <div class="stat-icon" style="background:var(--gold-light);color:var(--gold);">${icon("award",17,2)}</div>
      <div class="val" style="font-size:14.5px;">${melhorLoja}</div><div class="lbl">Melhor desempenho (${melhorMedia>=0?melhorMedia:0}%)</div>
    </div>`}
    <div class="stat-card">
      <div class="stat-icon" style="background:var(--blue-light);color:var(--blue);">${icon("clock",17,2)}</div>
      <div class="val">${execSemana}</div><div class="lbl">Execuções nos últimos 7 dias</div>
    </div>
  </div>`;

  const recentes = diarios.slice(-10);
  html += `<div class="chart-card">
    <h3>${icon("trendUp",15,2.2)}Evolução — checklist ${TIPO_LABEL[trendTipo].toLowerCase()} (últimos registros)</h3>
    ${recentes.length ? barChartSvg(recentes.map(r => ({label: fmtDateShort(r.date), value: r.pct})), {light:"#3D5FE0", dark:"#0A29B5"}) : '<div class="empty-hint" style="padding:10px;">Sem registros diários ainda.</div>'}
  </div>`;

  if (!scoped){
    const lojaItems = LOJAS.map(l => ({
      label: l.replace("Filial ","F. ").replace("Matriz ","M. "),
      value: porLoja[l].length ? Math.round(porLoja[l].reduce((a,b)=>a+b,0)/porLoja[l].length) : 0
    }));
    html += `<div class="chart-card">
      <h3>${icon("store",15,2.2)}Desempenho médio por loja — relatório geral</h3>
      ${barChartSvg(lojaItems, {light:"#34C17E", dark:"#178048"})}
    </div>`;
  }

  const freq = {};
  hist.forEach(r => r.pendentes.forEach(t => { freq[t] = (freq[t]||0) + 1; }));
  const topPend = Object.entries(freq).sort((a,b) => b[1]-a[1]).slice(0,6);
  html += `<div class="chart-card">
    <h3>${icon("alert",15,2.2)}Itens mais frequentemente pendentes</h3>
    ${topPend.length ? `<ul class="pending-list">${topPend.map(([t,c],i) => `<li><span><span class="pending-rank">${i+1}</span>${t}</span><span class="pending-count">${c}x</span></li>`).join("")}</ul>` : '<div class="empty-hint" style="padding:10px;">Nenhum item pendente registrado — ótimo trabalho!</div>'}
  </div>`;

  document.getElementById("main").innerHTML = html;
}

  const progressWrap = document.getElementById("progressWrap");
  const sectorTabsRow = document.getElementById("sectorTabsRow");

  document.querySelectorAll(".nav-btn").forEach(b => b.classList.toggle("active", b.getAttribute("data-view") === currentView));

  if (currentView === "sobre"){
    main.innerHTML = renderSobre();
    fabSave.style.display = "none";
    idRow.style.display = "none";
    subnavRow.style.display = "none";
    progressWrap.style.display = "none";
    sectorTabsRow.style.display = "none";
    return;
  }

  if (currentView === "historico"){
    idRow.style.display = "none";
    subnavRow.style.display = "none";
    progressWrap.style.display = "none";
    fabSave.style.display = "none";
    sectorTabsRow.style.display = "flex";

    renderHistorico();
    return;
  }

  if (currentView === "dashboard"){
    idRow.style.display = "none";
    subnavRow.style.display = "none";
    progressWrap.style.display = "none";
    fabSave.style.display = "none";
    sectorTabsRow.style.display = "flex";
    renderSectorTabs();
    renderDashboard();
    return;
  }

  if (currentView === "config"){
    if (isGerente()){ currentView = "checklist"; }
    else {
      idRow.style.display = "none";
      subnavRow.style.display = "none";
      progressWrap.style.display = "none";
      fabSave.style.display = "none";
      sectorTabsRow.style.display = "none";
      renderConfig();
      return;
    }
  }

  // currentView === 'checklist'
  idRow.style.display = "flex";
  subnavRow.style.display = "flex";
  progressWrap.style.display = "flex";
  fabSave.style.display = "flex";
  sectorTabsRow.style.display = "flex";
  renderSectorTabs();
  renderPillTabs();

  const sections = DATA[currentSector][currentTab];
  const checks = loadChecks(currentTab);
  if (!sections.length){
    main.innerHTML = emptyState("inbox", SECTOR_META[currentSector].ready ? "Nenhum item cadastrado ainda" : "Setor em construção", SECTOR_META[currentSector].ready ? "<span>Peça ao Diretor para cadastrar os itens em Configurações.</span>" : "<span>Esse setor ainda vai ser preenchido em breve.</span>");
  } else {
    main.innerHTML = sections.map(s => renderSection(s, checks)).join("");
  }
  updateProgress();
  attachChecklistHandlers();
}

function updateProgress(){
  const checks = loadChecks(currentTab);
  const sum = summarize(currentTab, checks);
  document.getElementById("progressFill").style.width = sum.pct + "%";
  document.getElementById("progressPct").textContent = `${sum.done}/${sum.total} · ${sum.pct}%`;
}

function attachChecklistHandlers(){
  document.querySelectorAll(".section-head").forEach(el => {
    el.addEventListener("click", () => {
      const id = el.getAttribute("data-section");
      collapsedState[id] = !collapsedState[id];
      localStorage.setItem(STORAGE_PREFIX + "collapsed", JSON.stringify(collapsedState));
      el.classList.toggle("collapsed");
      document.getElementById("body_" + id).classList.toggle("hidden");
    });
  });

  document.querySelectorAll('input[type="checkbox"]').forEach(cb => {
    cb.addEventListener("change", () => {
      const checks = loadChecks(currentTab);
      checks[cb.getAttribute("data-item")] = cb.checked;
      saveChecks(currentTab, checks);
      updateCounts();
      updateProgress();
    });
  });
}

function updateCounts(){
  const checks = loadChecks(currentTab);
  DATA[currentSector][currentTab].forEach(s => {
    const total = s.groups.reduce((a,g)=>a+g.items.length,0);
    const done = s.groups.reduce((a,g,gi)=>a+g.items.filter((t,idx)=>!!checks[itemId(s.id,gi,idx)]).length,0);
    const headEl = document.querySelector(`.section-head[data-section="${s.id}"] .count`);
    if (headEl) headEl.textContent = `${done}/${total}`;
  });
}

function showToast(msg){
  const t = document.getElementById("toast");
  t.textContent = msg;
  t.classList.add("show");
  setTimeout(() => t.classList.remove("show"), 2200);
}

document.querySelectorAll(".nav-btn").forEach(btn => {
  btn.addEventListener("click", () => {
    currentView = btn.getAttribute("data-view");
    render();
  });
});

dateInput.addEventListener("change", render);

document.getElementById("btnSave").addEventListener("click", () => {
  if (!auditorInput.value.trim()){
    showToast("Informe o nome do auditor antes de salvar");
    auditorInput.focus();
    return;
  }
  const checks = loadChecks(currentTab);
  const sum = summarize(currentTab, checks);
  const record = {
    id: Date.now() + "_" + Math.random().toString(36).slice(2,8),
    setor: currentSector,
    tipo: currentTab,
    loja: lojaSelect.value,
    auditor: auditorInput.value.trim(),
    date: dateInput.value,
    savedAt: new Date().toISOString(),
    total: sum.total,
    done: sum.done,
    pct: sum.pct,
    sections: sum.sections,
    pendentes: sum.pendentes
  };
  let hist = getHistorico();
  hist = hist.filter(r => !(r.setor === record.setor && r.tipo === record.tipo && r.loja === record.loja && r.date === record.date));
  hist.push(record);
  setHistorico(hist);
  showToast(`Salvo às ${fmtHora(record.savedAt)} — ${sum.pct}% concluído`);
});

document.getElementById("btnReset").addEventListener("click", () => {
  if (confirm("Deseja reiniciar todos os itens marcados desta lista?")){
    saveChecks(currentTab, {});
    render();
    showToast("Checklist reiniciado");
  }
});

/* ---------- Login / sessão ---------- */
const SESSION_KEY = STORAGE_PREFIX + "session";
let session = null;
try { session = JSON.parse(localStorage.getItem(SESSION_KEY) || "null"); } catch(e){ session = null; }

const loginRoleSelect = document.getElementById("loginRoleSelect");
ROLES.forEach(r => {
  const opt = document.createElement("option");
  opt.value = r.id; opt.textContent = r.label;
  loginRoleSelect.appendChild(opt);
});

document.getElementById("btnLogout").innerHTML = icon("logout", 13, 2.4);

function isGerente(){ return session && session.role === "gerente"; }

function applyRoleRestrictions(){
  if (!session) return;
  const displayName = isGerente() ? session.loja : "Diretor";
  const displayRole = isGerente() ? "Gestor de loja" : "Acesso master";
  document.getElementById("ucLabelText").textContent = displayName;
  document.getElementById("ucRoleText").textContent = displayRole;
  document.getElementById("suName").textContent = displayName;
  document.getElementById("suRole").textContent = displayRole;
  const initials = displayName.split(" ").filter(w => w.length > 2 || /^[A-ZÀ-Ú]/.test(w)).slice(0,2).map(w => w[0]).join("").toUpperCase() || displayName.slice(0,2).toUpperCase();
  document.getElementById("suAvatar").textContent = initials;
  document.getElementById("navConfig").style.display = isGerente() ? "none" : "flex";

  if (isGerente()){
    lojaSelect.innerHTML = "";
    const opt = document.createElement("option");
    opt.value = session.loja; opt.textContent = session.loja;
    lojaSelect.appendChild(opt);
    lojaSelect.value = session.loja;
    lojaSelect.disabled = true;
    histFilterLoja = session.loja;
  } else {
    lojaSelect.disabled = false;
    if (lojaSelect.options.length < LOJAS.length){
      lojaSelect.innerHTML = "";
      LOJAS.forEach(l => {
        const opt = document.createElement("option");
        opt.value = l; opt.textContent = l;
        lojaSelect.appendChild(opt);
      });
      lojaSelect.value = localStorage.getItem(STORAGE_PREFIX + "last_loja") || LOJAS[0];
    }
  }
}

function doLogin(){
  const id = loginRoleSelect.value;
  const pass = document.getElementById("loginPassword").value;
  const found = ROLES.find(r => r.id === id);
  const errEl = document.getElementById("loginError");
  if (found && pass === found.password){
    session = { id: found.id, role: found.role, loja: found.loja, label: found.label };
    localStorage.setItem(SESSION_KEY, JSON.stringify(session));
    errEl.textContent = "";
    startApp();
  } else {
    errEl.textContent = "Senha incorreta. Tente novamente.";
  }
}

document.getElementById("loginBtn").addEventListener("click", doLogin);
document.getElementById("loginPassword").addEventListener("keydown", (e) => { if (e.key === "Enter") doLogin(); });

document.getElementById("btnLogout").addEventListener("click", () => {
  if (confirm("Deseja sair do aplicativo?")){
    localStorage.removeItem(SESSION_KEY);
    location.reload();
  }
});

function startApp(){
  document.getElementById("loginScreen").style.display = "none";
  document.getElementById("appShell").style.display = "block";
  applyRoleRestrictions();
  render();
}

if (session){
  startApp();
} else {
  document.getElementById("loginScreen").style.display = "flex";
}

if ("serviceWorker" in navigator){
  window.addEventListener("load", () => {
    navigator.serviceWorker.register("sw.js").catch(()=>{});
  });
}
</script>
